
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#236747" id="theme-color">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おつとめ">
<title>みかぐらうた｜毎日のおてふり</title>
<style>
:root {font-family:system-ui,sans-serif;--bg:#f7f4ec;--surface:#fffdf8;--panel:#f3ecdd;--ink:#2f352f;--muted:#586a5a;--accent:#3e6b52;--pressed:#9a6d43;--secondary:#e7eadf;--line:#cbd6c5;color:var(--ink);background:var(--bg)}
:root[data-theme="clean"] {--bg:#eef4ef;--surface:#fff;--panel:#eef4ef;--ink:#25382d;--muted:#617366;--accent:#236747;--pressed:#885d21;--secondary:#e3ece5;--line:#d9e6dc}
:root[data-theme="formal"] {--bg:#0c2827;--surface:#102f2d;--panel:#fffaf0;--ink:#f7f3e8;--muted:#d5e2da;--accent:#8a642d;--pressed:#6e4c22;--secondary:#25443f;--line:#a8874e}
* { box-sizing: border-box; }
body { margin: 0; }
main {
  max-width: 560px;
  min-height: 100dvh;
  margin: auto;
  padding: 24px 18px 48px;
  background: var(--surface);
}
header { text-align: center; margin-bottom: 24px; }
h1 { font-size: 25px; margin-bottom: 5px; }
h2 { font-size: 19px; }
small, .muted { color: var(--muted); }
.card {
  padding: 22px;
  background: var(--panel);
  border-radius: 18px;
  margin: 18px 0;
}
#today { font-size: 16px; }
#song {
  font-size: 27px;
  font-weight: bold;
  overflow-wrap: anywhere;
}
#status { min-height: 24px; }
button, select, input {
  font: inherit;
}
button {
  width: 100%;
  min-height: 52px;
  margin: 6px 0;
  padding: 12px;
  border: 0;
  border-radius: 12px;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled {
  opacity: .5;
  cursor: not-allowed;
}
.primary {
  min-height: 84px;
  background: var(--accent);
  color: white;
  font-size: 23px;
  font-weight: bold;
}
.secondary {
  background: var(--secondary);
  color: var(--ink);
}
audio { width: 100%; margin: 12px 0; }
.playback-time { margin: 7px 2px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; font-size: 16px; color: var(--muted); }
.playback-progress { display: block; width: 100%; height: 8px; margin: 10px 0 14px; appearance: none; border: 0; border-radius: 99px; overflow: hidden; background: var(--line); }
.playback-progress::-webkit-progress-bar { background: var(--line); border-radius: 99px; }
.playback-progress::-webkit-progress-value { background: var(--accent); border-radius: 99px; }
.playback-progress::-moz-progress-bar { background: var(--accent); }
.primary:focus-visible, .secondary:focus-visible { outline: 3px solid #111; outline-offset: 3px; }
#play[aria-pressed="true"] { background: var(--pressed); }
details { margin-top: 28px; }
summary {
  padding: 17px;
  border-radius: 12px;
  background: var(--secondary);
  font-weight: bold;
  cursor: pointer;
}
label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}
input[type=file], select {
  display: block;
  width: 100%;
  min-height: 50px;
  margin: 10px 0;
  padding: 10px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
}
td, th {
  padding: 10px 4px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  overflow-wrap: anywhere;
}
.notice {
  padding: 12px;
  border-radius: 10px;
  background: #fff3d7;
}
#error {
  color: #ac2525;
  white-space: pre-wrap;
}

.card {color:#25382d}
:root[data-theme="formal"] main {background:linear-gradient(155deg,#143e3a,#092421)}
:root[data-theme="formal"] header h1,:root[data-theme="formal"] header .muted {color:#f6f0df}
:root[data-theme="formal"] .card {border:1px solid #b99c64;box-shadow:0 5px 18px #0002}
:root[data-theme="formal"] .primary {border:1px solid #d6b473}
:root[data-theme="formal"] .secondary,:root[data-theme="formal"] summary {color:#fff8ed;border:1px solid #896f4a}
:root[data-theme="formal"] input,:root[data-theme="formal"] select {color:#25382d;background:#fffaf0}
:root[data-theme="gentle"] main {background:linear-gradient(180deg,#fffdf8,#f7f1e4)}
:root[data-theme="gentle"] .card {border:1px solid #e5ddca;box-shadow:0 4px 14px #4e4a3610}
:root[data-theme="clean"] .card {box-shadow:0 5px 18px #163b2910}
.theme-option {display:flex;align-items:center;gap:12px;padding:12px 8px;min-height:48px;border-bottom:1px solid var(--line)}
.theme-option input {flex:0 0 auto;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.theme-option span {font-weight:600}

.app-header .header-emblem {display:none}
.song-details {display:flex;justify-content:space-between;align-items:center;gap:10px}
.song-details #today {margin:8px 0}
.song-number {font-size:14px}
.settings-chevron {margin-left:auto}
.settings-symbol {margin-right:7px;display:inline-block;vertical-align:middle;width:23px;height:23px;flex-shrink:0}
:root[data-theme="gentle"] .app-header .header-emblem {display:grid}
/* Japanese A layout: leave a modest ornamental footer, not an empty screen. */
:root[data-theme="gentle"] main {display:flex;flex-direction:column;min-height:100dvh;padding-bottom:max(12px,env(safe-area-inset-bottom))}
:root[data-theme="gentle"] details {margin-top:auto;padding-top:22px}
:root[data-theme="gentle"] .now-card::before,:root[data-theme="gentle"] .now-card::after {opacity:.12}
/* Ver.0.7-A refinement: match the agreed A screen's proportions and subtle artwork. */
:root[data-theme="gentle"] body {background:#f4eee1}
:root[data-theme="gentle"] main {
  position:relative;isolation:isolate;overflow:hidden;max-width:560px;
  min-height:100dvh;padding:28px clamp(20px,5.5vw,30px) max(45px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#fffcf5 0%,#fffbf2 70%,#f7f0e1 100%);
  box-shadow:0 0 22px #66573813;
}
:root[data-theme="gentle"] main::before {
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  opacity:.42;background:url("./gentle-decoration.svg") center bottom/100% 100% no-repeat;
}
:root[data-theme="gentle"] main::after {
  content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse at 48% 15%,#fffdfa 0%,transparent 72%);
}
:root[data-theme="gentle"] .app-header {
  display:flex;align-items:center;justify-content:center;gap:13px;
  text-align:left;margin:7px 0 24px;min-height:66px;
}
:root[data-theme="gentle"] .header-copy {min-width:0}
:root[data-theme="gentle"] .header-emblem {
  display:grid;place-items:center;width:58px;height:58px;flex:0 0 58px;
  background:#244c3a;color:#fff;border:4px solid #fff;border-radius:50%;
  font:36px Georgia,serif;box-shadow:0 0 0 1.5px #234b39,0 2px 8px #1b342322;
}
:root[data-theme="gentle"] h1 {
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:clamp(18px,5.4vw,25px);line-height:1.3;letter-spacing:0;
  margin:0 0 4px;white-space:nowrap;color:#15251b;
}
:root[data-theme="gentle"] .app-header .muted {font-size:13px;color:#4f5549;letter-spacing:.025em}
:root[data-theme="gentle"] .now-card {
  position:relative;overflow:hidden;text-align:center;
  padding:17px 18px 15px;margin:0 0 22px;
  border-radius:21px;border:1px solid #ebdfcb;background:#fffdf8;
  box-shadow:0 7px 16px #54492f18,0 1px 4px #54492f0c;
}
:root[data-theme="gentle"] .now-card::before,
:root[data-theme="gentle"] .now-card::after {
  content:"";position:absolute;width:83px;height:78px;opacity:.25;pointer-events:none;
  background:radial-gradient(ellipse at 19% 40%,#b9c9a9 0 14%,transparent 15%),
  radial-gradient(ellipse at 52% 20%,#acc0a4 0 16%,transparent 17%),
  radial-gradient(ellipse at 70% 71%,#afc4a7 0 17%,transparent 18%);
}
:root[data-theme="gentle"] .now-card::before {left:-35px;top:-29px;transform:rotate(-18deg)}
:root[data-theme="gentle"] .now-card::after {right:-31px;bottom:-16px;transform:rotate(115deg)}
:root[data-theme="gentle"] .today-label {
  position:relative;z-index:1;display:inline-block;
  padding:7px 18px;margin:0 0 14px;border-radius:99px;
  color:#fff;background:#3c6b52;font-weight:650;font-size:15px;line-height:1.45;
}
:root[data-theme="gentle"] #song {
  position:relative;z-index:1;margin:0 0 14px;
  font:700 clamp(24px,7.2vw,35px)/1.33 "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  overflow-wrap:anywhere;color:#17251a;
}
:root[data-theme="gentle"] .song-details {
  position:relative;z-index:1;display:flex;align-items:center;
  justify-content:space-between;gap:9px;margin:0;
}
:root[data-theme="gentle"] #today {margin:0;text-align:left;white-space:nowrap;font-size:14px;color:#30372d}
:root[data-theme="gentle"] .song-number {
  flex-shrink:0;padding:6px 12px;border-radius:99px;
  background:#f2e7d1;color:#354031;font-weight:700;font-size:14px;
}
:root[data-theme="gentle"] #status {
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;
}
:root[data-theme="gentle"] .primary {
  min-height:79px;margin:0 0 19px;padding:13px 16px;
  border:1px solid #87a88f;border-radius:99px;
  background:linear-gradient(#42785b,#285941);color:#fff;
  box-shadow:inset 0 2px 1px #ffffff65,0 4px 0 #23503a,0 8px 13px #29463322;
  font:700 clamp(19px,5.8vw,25px)/1.3 "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  letter-spacing:0;
}
:root[data-theme="gentle"] #play[aria-pressed="true"] {
  background:linear-gradient(#ac8857,#815f35);
  box-shadow:inset 0 2px 1px #ffffff4a,0 4px 0 #6e4e2b;
}
:root[data-theme="gentle"] .playback-time {
  display:flex;justify-content:space-between;gap:10px;
  margin:0 4px 7px;color:#263328;font-size:14px;font-weight:650;
}
:root[data-theme="gentle"] .progress-wrap {
  position:relative;margin:0 4px 24px;height:17px;
}
:root[data-theme="gentle"] .progress-wrap::after {
  content:"";position:absolute;left:calc(var(--progress-pct,0)*1%);top:1px;
  width:15px;height:15px;transform:translateX(-50%);border-radius:50%;
  background:#fff;box-shadow:0 1px 5px #142c262b;
  pointer-events:none;
}
:root[data-theme="gentle"] .playback-progress {
  width:100%;height:10px;margin:3px 0 0;
  appearance:none;border:0;border-radius:99px;overflow:hidden;background:#d6e0d9;
}
:root[data-theme="gentle"] .playback-progress::-webkit-progress-bar {background:#d6e0d9}
:root[data-theme="gentle"] .playback-progress::-webkit-progress-value {background:#326a4c;border-radius:99px}
:root[data-theme="gentle"] .playback-progress::-moz-progress-bar {background:#326a4c}
:root[data-theme="gentle"] #error:empty {display:none}
:root[data-theme="gentle"] details {margin:0}
:root[data-theme="gentle"] summary {
  display:flex;align-items:center;gap:12px;min-height:66px;
  padding:11px 15px;background:#fffbf4;border:1px solid #e1d5c3;
  border-radius:15px;box-shadow:0 2px 9px #4e432415;
  font-weight:700;font-size:16px;color:#273529;
}
:root[data-theme="gentle"] summary::marker {content:""}
:root[data-theme="gentle"] summary::-webkit-details-marker {display:none}
:root[data-theme="gentle"] .settings-symbol {width:24px;height:24px;flex:0 0 24px;color:#364737}
:root[data-theme="gentle"] .settings-chevron {margin-left:auto;font-size:24px}
:root[data-theme="gentle"] details[open] .settings-chevron {transform:rotate(180deg)}
:root[data-theme="gentle"] details .card {background:#fffdf8;color:#25382d}
:root[data-theme="gentle"] main {padding-bottom:max(12px,env(safe-area-inset-bottom))}
/* Closed settings card sits above the lower ornament. Expanded settings remain in normal flow. */
:root[data-theme="gentle"] details:not([open]) {transform:translateY(17px);margin-bottom:0}
:root[data-theme="gentle"] details[open] {margin-top:26px;padding-top:0}
:root[data-theme="gentle"] .settings-symbol {stroke-linejoin:round}

@media(max-width:365px) {
  :root[data-theme="gentle"] main {padding-inline:16px}
  :root[data-theme="gentle"] .app-header {gap:10px}
  :root[data-theme="gentle"] .header-emblem {width:48px;height:48px;flex-basis:48px;font-size:29px}
  :root[data-theme="gentle"] h1 {font-size:18px}
  :root[data-theme="gentle"] .now-card {padding-inline:13px}
  :root[data-theme="gentle"] #today {font-size:13px}
}

/* Theme A: user-selected supplied artwork (haikei.png + footer.png). */
:root[data-theme="gentle"] main::before {
  content:""; position:fixed; z-index:-1; pointer-events:none;
  left:50%; width:min(100%,560px); top:0; bottom:0; transform:translateX(-50%); opacity:.72;
  background-image:url("./gentle-leaves.png");
  background-repeat:repeat-y;
  background-size:100% auto;
  background-position:center 105px;
}
:root[data-theme="gentle"] main::after {
  content:""; position:fixed; z-index:-1; pointer-events:none;
  left:50%;width:min(100%,560px);top:auto;bottom:0;height:clamp(125px,22vh,195px);transform:translateX(-50%);
  opacity:1;
  background-image:url("./gentle-footer.png");
  background-repeat:no-repeat;
  background-size:100% auto;
  background-position:center bottom;
}
:root[data-theme="gentle"] .now-card::before,
:root[data-theme="gentle"] .now-card::after {display:none}
/* Other themes retain their existing design. */

/* Common: remove the song-number badge and center the date. */
.song-details {display:flex;align-items:center;justify-content:center;text-align:center}
.song-details #today {width:100%;margin:8px auto;text-align:center}
:root[data-theme="gentle"] .song-details {justify-content:center}
:root[data-theme="gentle"] #today {width:100%;margin:0 auto;text-align:center}
/* Common: touch-accessible seek slider, preserving the established progress-bar position. */
.progress-wrap::after,:root[data-theme="gentle"] .progress-wrap::after {content:none;display:none}
.progress-wrap {height:36px;display:flex;align-items:center}
#seek {
 display:block;box-sizing:border-box;width:100%;height:36px;margin:0;
 padding:0;min-height:0;border:0;border-radius:99px;
 appearance:none;-webkit-appearance:none;cursor:pointer;
 background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--seek-percent,0%),var(--line) var(--seek-percent,0%),var(--line) 100%) center / 100% 10px no-repeat;
 touch-action:pan-y;
}
#seek::-webkit-slider-runnable-track {height:10px;border-radius:99px;background:transparent}
#seek::-moz-range-track {height:10px;border-radius:99px;background:transparent}
#seek::-webkit-slider-thumb {
 appearance:none;-webkit-appearance:none;width:22px;height:22px;
 margin-top:-6px;border:2px solid var(--accent);border-radius:50%;
 background:#fff;box-shadow:0 1px 5px #142c262b;
}
#seek::-moz-range-thumb {width:19px;height:19px;border:2px solid var(--accent);border-radius:50%;background:#fff;box-shadow:0 1px 5px #142c262b}
#seek:disabled {opacity:.5;cursor:not-allowed}
#seek:focus-visible {outline:3px solid var(--accent);outline-offset:6px}
:root[data-theme="gentle"] .progress-wrap {height:36px;margin-bottom:24px}
:root[data-theme="gentle"] #seek {width:100%;height:36px;margin:0}


/* Approved 2026-09-26 header and main-card layout. */
.app-header {
  display:flex;align-items:center;justify-content:center;
  margin:0 0 24px;padding:0;background:transparent;text-align:center;
}
.header-event-art {
  display:block;position:static;width:216px;height:auto;max-height:none;
  object-fit:contain;margin:0 auto;transform:translateX(20.5%);
}
:root[data-theme] .card-title,#song {
  font:700 clamp(16px,6.3vw,32px)/1.33 "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  white-space:nowrap;overflow-wrap:normal;color:#17251a;
}
:root[data-theme] .card-title {font-size:clamp(24px,9.45vw,48px);margin:0 0 19px}
#song {margin:0}
#song.is-message {font-size:clamp(17px,5.3vw,27px);white-space:normal}
.primary {display:flex;align-items:center;justify-content:center;gap:14px}
.button-icon {color:currentColor;display:inline-block;flex:0 0 auto}
.button-icon[hidden] {display:none}
.play-icon {
  width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;
  border-left:17px solid currentColor;margin-left:4px;
}
.pause-icon {width:22px;height:28px;display:inline-flex;justify-content:space-between}
.pause-icon::before,.pause-icon::after {
  content:"";display:block;width:7px;height:28px;border-radius:2px;background:currentColor;
}
@media(max-width:365px) {
  .header-event-art {width:176px}
}

</style>
</head>

<script>
"use strict";

const DAYS = [
 "日曜日", "月曜日", "火曜日", "水曜日",
 "木曜日", "金曜日", "土曜日"
];

const $ = id => document.getElementById(id);

const audio = $("audio");
const THEMES = ["gentle","clean","formal"];
function applyTheme(theme, persist = false) {
 const next = THEMES.includes(theme) ? theme : "gentle";
 document.documentElement.dataset.theme = next;
 document.querySelectorAll('input[name="theme"]').forEach(input => {input.checked = input.value === next;});
 const meta = document.getElementById("theme-color");
 if(meta)meta.content=next==="formal"?"#0c2827":next==="clean"?"#236747":"#f7f4ec";
 if(persist)try{localStorage.setItem("otsutome_design_theme",next)}catch(error){console.warn(error)}
}
let savedTheme="gentle";
try{savedTheme=localStorage.getItem("otsutome_design_theme")||"gentle"}catch(_){}
applyTheme(savedTheme);
document.querySelectorAll('input[name="theme"]').forEach(input=>input.addEventListener("change",()=>applyTheme(input.value,true)));
const DB_NAME = "otsutome_mobile_v3";
const STORE = "songs";

let db = null;
let songs = [];
let currentIndex = -1;
let currentUrl = null;
let saving = false;
let playPending = false;
function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return "--:--";
  const whole = Math.floor(seconds);
  const minutes = Math.floor(whole / 60);
  return minutes + ":" + String(whole % 60).padStart(2,"0");
}
let seeking = false;
const seek = $("seek");
function setSeekView(percent) {
  const value = Math.min(1000,Math.max(0,percent));
  seek.value = String(Math.round(value));
  seek.style.setProperty("--seek-percent", (value / 10) + "%");
}
function updatePlaybackTime() {
  const duration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
  const elapsed = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
  seek.disabled = !duration || !audio.getAttribute("src");
  $("remaining").textContent = "全体 " + (duration ? formatTime(duration) : "--:--");
  if (!seeking) {
    $("elapsed").textContent = "経過 " + formatTime(elapsed);
    setSeekView(duration ? elapsed / duration * 1000 : 0);
  }
  seek.setAttribute("aria-valuetext",formatTime(seeking && duration ? Number(seek.value) / 1000 * duration : elapsed) + " / " + (duration ? formatTime(duration) : "--:--"));
}
function moveSeek() {
  const duration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
  if (!duration || !audio.getAttribute("src")) return;
  seeking = true;
  const target = Number(seek.value) / 1000 * duration;
  setSeekView(Number(seek.value));
  $("elapsed").textContent = "経過 " + formatTime(target);
  seek.setAttribute("aria-valuetext",formatTime(target) + " / " + formatTime(duration));
  try { audio.currentTime = Math.min(duration,Math.max(0,target)); }
  catch (error) { console.warn("再生位置を変更できません",error); }
}
seek.addEventListener("input",moveSeek);
seek.addEventListener("change",() => { moveSeek(); seeking = false; updatePlaybackTime(); });
seek.addEventListener("pointercancel",() => {seeking = false;updatePlaybackTime();});
["loadedmetadata","durationchange","timeupdate","seeked","emptied","ended"].forEach(event => {
  audio.addEventListener(event,updatePlaybackTime);
});
function updateMainButton() {
  const playing = !audio.paused && !audio.ended;
  const button = $("play");
  const icon = $("play-icon");
  const label = $("play-label");
  const mode = playPending ? "loading" : (playing ? "pause" : "play");
  label.textContent = mode === "loading" ? "読み込み中…" : (mode === "pause" ? "一時停止" : "おつとめ開始");
  icon.hidden = mode === "loading";
  icon.className = "button-icon " + (mode === "pause" ? "pause-icon" : "play-icon");
  button.setAttribute("aria-label", label.textContent);
  button.setAttribute("aria-pressed", String(playing));
  button.disabled = saving || playPending || !db || songs.length !== 7;
}

function readWeekday() {
  try {
    const value = localStorage.getItem(
      "otsutome_start_weekday"
    );
    if (value !== null && /^[0-6]$/.test(value)) {
      return Number(value);
    }
  } catch (error) {
    console.warn(error);
  }
  return 1;
}

let startWeekday = readWeekday();
$("weekday").value = String(startWeekday);

function todayIndex() {
  return (
    new Date().getDay() - startWeekday + 7
  ) % 7;
}

function sortFiles(files) {
  return [...files].sort((a, b) =>
    a.name.localeCompare(b.name, "ja", {
      numeric: true,
      sensitivity: "base"
    })
  );
}

const SONG_TITLES = Object.freeze({
  "01_yorozuyo": "よろづよ八首",
  "02_mika1.2": "一下り目・二下り目",
  "03_mika3.4": "三下り目・四下り目",
  "04_mika5.6": "五下り目・六下り目",
  "05_mika7.8": "七下り目・八下り目",
  "06_mika9.10": "九下り目・十下り目",
  "07_mika11.12": "十一下り目・十二下り目"
});

function cleanName(name) {
  const base = name.replace(/\.mp3$/i, "");
  return SONG_TITLES[base.toLowerCase()] || base;
}

function reportError(message) {
  $("error").textContent = message;
}

function refresh() {
  $("count").textContent =
    `登録曲数：${songs.length}曲 / 7曲`;

  const index = todayIndex();

  if (songs.length !== 7) {
    $("song").classList.add("is-message");
    $("song").textContent =
      "音源を7曲登録してください";
    $("status").textContent = "音源未登録";
    return;
  }

  $("song").classList.remove("is-message");
  $("song").textContent = cleanName(
    songs[index].name
  );

  if (audio.paused && !saving) {
    $("status").textContent =
      "再生待機中";
  }
}

function updateSchedule() {
  const tbody = $("schedule");
  tbody.replaceChildren();

  // 表示順は月曜日から日曜日
  for (const day of [1,2,3,4,5,6,0]) {
    const index = (
      day - startWeekday + 7
    ) % 7;

    const row = document.createElement("tr");
    const dayCell = document.createElement("td");
    const songCell = document.createElement("td");

    dayCell.textContent = DAYS[day];

    songCell.textContent = songs.length === 7
      ? cleanName(songs[index].name)
      : `${index + 1}曲目`;

    row.append(dayCell, songCell);
    tbody.appendChild(row);
  }
}

function clearAudio() {
  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  if (currentUrl) {
    URL.revokeObjectURL(currentUrl);
    currentUrl = null;
  }

  currentIndex = -1;
  updatePlaybackTime();
  updateMainButton();
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error(
        "このブラウザは音源保存に対応していません"
      ));
      return;
    }

    const request = indexedDB.open(DB_NAME, 1);

    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(STORE)) {
        database.createObjectStore(STORE, {
          keyPath: "id"
        });
      }
    };

    request.onsuccess = () =>
      resolve(request.result);

    request.onerror = () =>
      reject(request.error || new Error(
        "保存領域を開けません"
      ));
  });
}

function loadSongs() {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(
      STORE, "readonly"
    );
    const request = transaction
      .objectStore(STORE).getAll();

    request.onsuccess = () => {
      resolve(
        request.result
          .sort((a,b) => a.id - b.id)
          .map(item => item.file)
      );
    };

    request.onerror = () =>
      reject(request.error);
  });
}

function saveSongs(files) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(
      STORE, "readwrite"
    );

    const store = transaction.objectStore(STORE);

    store.clear();

    files.forEach((file, index) => {
      store.put({ id: index, file });
    });

    transaction.oncomplete = resolve;

    transaction.onerror = () =>
      reject(transaction.error || new Error(
        "音源を保存できません"
      ));

    transaction.onabort = () =>
      reject(transaction.error || new Error(
        "音源の保存が中断されました"
      ));
  });
}

$("files").addEventListener(
  "change", async event => {

    if (saving) return;

    const selected = Array.from(
      event.target.files || []
    );

    const valid = selected.filter(file =>
      /\.mp3$/i.test(file.name)
    );

    if (
      selected.length !== 7 ||
      valid.length !== 7
    ) {
      alert("MP3ファイルを7曲選択してください。");
      event.target.value = "";
      return;
    }

    if (!db) {
      reportError(
        "音源保存を利用できません。" +
        "ブラウザの設定を確認してください。"
      );
      return;
    }

    const sorted = sortFiles(valid);

    if (!confirm(
      "選択した7曲で登録音源を入れ替えますか？"
    )) {
      event.target.value = "";
      return;
    }

    saving = true;
    $("play").disabled = true;
    $("restart").disabled = true;
    $("files").disabled = true;
    $("status").textContent = "音源を保存中";
    reportError("");

    try {
      clearAudio();
      await saveSongs(sorted);

      // 保存後に読み直して確認する
      songs = await loadSongs();

      if (songs.length !== 7) {
        throw new Error(
          "保存した曲数が正しくありません"
        );
      }

      updateSchedule();
      refresh();
      updateMainButton();

      $("storage").textContent =
        "音源をこの端末に保存しました。";

      $("status").textContent =
        "7曲の登録が完了しました";

      alert("7曲を登録・保存しました。");

    } catch (error) {
      console.error(error);

      reportError(
        "音源を保存できませんでした。" +
        "端末の空き容量やブラウザの設定を" +
        "確認してください。\n" +
        (error.message || "")
      );

      try {
        songs = await loadSongs();
      } catch (_) {
        songs = [];
      }

      updateSchedule();
      refresh();
      updateMainButton();

    } finally {
      saving = false;
      updateMainButton();
      $("restart").disabled = false;
      $("files").disabled = false;
      event.target.value = "";
    }
  }
);

$("save").addEventListener("click", () => {
  const next = Number($("weekday").value);

  if (!Number.isInteger(next) ||
      next < 0 || next > 6) {
    alert("曜日を選択してください。");
    return;
  }

  try {
    localStorage.setItem(
      "otsutome_start_weekday",
      String(next)
    );
  } catch (error) {
    reportError(
      "曜日を保存できませんでした。" +
      "ブラウザの保存設定を確認してください。"
    );
    return;
  }

  clearAudio();
  startWeekday = next;
  updateSchedule();
  refresh();

  $("status").textContent =
    "開始曜日を保存しました";

  alert(
    "1曲目の開始曜日を" +
    DAYS[startWeekday] +
    "に設定しました。"
  );
});

async function playSong(fromBeginning = false) {
  if (saving) return;

  if (songs.length !== 7) {
    alert("先に7曲を登録してください。");
    return;
  }

  const index = todayIndex();

  if (
    currentIndex !== index ||
    !audio.getAttribute("src")
  ) {
    clearAudio();

    currentUrl = URL.createObjectURL(
      songs[index]
    );

    audio.src = currentUrl;
    currentIndex = index;

  } else if (fromBeginning) {
    audio.currentTime = 0;
  }

  reportError("");

  try {
    playPending = true;
    updateMainButton();
    await audio.play();
    $("status").textContent = "再生中";
  } catch (error) {
    console.error(error);
    reportError(
      "再生できませんでした。" +
      "音源と音声出力先を確認してください。"
    );
    $("status").textContent = "再生エラー";
  } finally {
    playPending = false;
    updateMainButton();
  }
}

$("play").addEventListener("click", () => {
  if (playPending || saving) return;
  if (!audio.paused && !audio.ended) {
    audio.pause();
    $("status").textContent = "一時停止中";
    updateMainButton();
    return;
  }
  if (audio.ended) audio.currentTime = 0;
  playSong(false);
});
audio.addEventListener("play", updateMainButton);
audio.addEventListener("pause", updateMainButton);

$("restart").addEventListener("click", () => {
  playSong(true);
});

audio.addEventListener("ended", () => {
  $("status").textContent = "再生終了";
  updateMainButton();
});

audio.addEventListener("error", () => {
  if (audio.getAttribute("src")) {
    reportError(
      "音源の読み込みに失敗しました。"
    );
  }
});

// 翌日になっても、新たな再生時には
// 必ずその日の曲を選択する。
function checkDateChange() {
  if (audio.paused) {
    if (
      currentIndex !== -1 &&
      currentIndex !== todayIndex()
    ) {
      clearAudio();
    }
    refresh();
  }
}

document.addEventListener(
  "visibilitychange", () => {
    if (!document.hidden) checkDateChange();
  }
);

window.addEventListener(
  "focus", checkDateChange
);

// 端末の時刻が変わった際の画面更新
setInterval(() => {
  if (!document.hidden && audio.paused) {
    checkDateChange();
  }
}, 60000);

async function initialize() {
  refresh();
  updateSchedule();

  $("play").disabled = true;

  try {
    db = await openDatabase();
    songs = await loadSongs();

    updateSchedule();
    refresh();
    updateMainButton();

    if (songs.length === 7) {
      $("storage").textContent =
        "保存済みの7曲を読み込みました。";
    } else {
      $("storage").textContent =
        "MP3ファイルを7曲登録してください。";
    }

    // 対応ブラウザでは保存領域の
    // 自動削除リスクの低減を要求する。
    if (
      navigator.storage &&
      navigator.storage.persist
    ) {
      navigator.storage.persist().catch(
        () => {}
      );
    }

  } catch (error) {
    console.error(error);
    reportError(
      "音源の保存領域を開けませんでした。" +
      "通常モードのブラウザで開き直してください。"
    );
    $("status").textContent = "保存機能エラー";
  } finally {
    updateMainButton();
  }
}

initialize();

// Keep the app shell available when the network is unavailable.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {scope:"./"})
      .catch(error => console.warn("オフライン起動の設定に失敗しました", error));
  });
}

</script>
